name: Setup
description: >-
  pnpm, Node and a frozen-lockfile install. Identical in every job on purpose:
  several copies of this are several places for the Node version to drift.

  Checkout is deliberately NOT here, and that is the whole story of this file. A
  local action (`uses: ./.github/actions/setup`) cannot be loaded until the
  repository is on disk, so a job whose *first* step is this one fails with
  "Can't find 'action.yml' ... Did you forget to run actions/checkout before
  running your local action?" — the checkout inside could never run, because the
  file it lives in had not been fetched yet. Every CI job failed that way, so the
  gate was dead in every run. Each job now does its own `actions/checkout@v5`
  first; this action starts where that leaves off.

runs:
  using: composite
  steps:
    # Before setup-node, so the pnpm store is on PATH and can be cached.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      # The lockfile is the contract. `--frozen-lockfile` fails rather than
      # silently resolving something new, so a PR cannot merge with a lockfile
      # nobody re-generated.
      run: pnpm install --frozen-lockfile
      shell: bash
