name: debug-runtime
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm add -g vercel@latest
      - name: fetch runtime logs for live alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          set +e
          ALIAS="easyerp-api-three.vercel.app"
          echo "=== resolve alias -> DID ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v4/aliases/$ALIAS?teamId=$VERCEL_ORG_ID" | tee /tmp/alias.json | jq .
          DID=$(jq -r '.deployment.id // .deploymentId // empty' /tmp/alias.json)
          echo "DID=$DID"
          if [ -z "$DID" ]; then
            echo "fallback via v6 deployments"
            curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=5" | jq -r '.deployments[] | "\(.uid) \(.url) alias=\(.alias[0] // "-") state=\(.readyState)"' | head -n 20
            DID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=10" | jq -r '[.deployments[] | select(.readyState=="READY")] | .[0].uid // empty')
            echo "fallback DID=$DID"
          fi
          echo "TARGET_DID=$DID"
          echo "=== build logs ==="
          vercel inspect "$DID" --logs 2>&1 | tail -n 300 || true
          echo "=== vercel logs --deployment (1h) ==="
          timeout 30 vercel logs --deployment "$DID" --since 1h 2>&1 | tail -n 1500 || true
          echo "=== vercel logs --deployment (24h) ==="
          timeout 30 vercel logs --deployment "$DID" --since 24h 2>&1 | tail -n 1500 || true
          echo "=== API events v2 (limit 200) ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/deployments/$DID/events?teamId=$VERCEL_ORG_ID&limit=200" | jq -r '.[]? | "\(.type) \(.payload.text // .payload.errorMessage // .payload.message // "" | .[0:500])"' 2>&1 | tail -n 400 | head -n 400 || curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/deployments/$DID/events?teamId=$VERCEL_ORG_ID&limit=200" | head -c 15000; echo
          echo "=== curl debug-env & health ==="
          curl -s "https://$ALIAS/api/debug-env" 2>&1 | head -c 3000; echo
          curl -s -i "https://$ALIAS/api/health" 2>&1 | head -n 60 || true
          echo "=== deployment object ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/deployments/$DID?teamId=$VERCEL_ORG_ID" | jq '{uid, url, readyState, createdAt, build: .builds[0].use}' | head -n 40 || true
