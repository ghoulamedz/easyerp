name: debug-vercel-runtime
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm add -g vercel@latest
      - name: API inspect READY deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          set +e
          echo "=== API project deployments (READY/BULDING) ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=10" | jq -r '.deployments[] | "\(.uid) \(.url) alias=\(.alias[0] // "-") state=\(.readyState) target=\(.target // "-") created=\(.createdAt)"' | head -n 20
          DID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20" | jq -r '[.deployments[] | select(.readyState=="READY")] | .[0].uid // empty')
          DURL=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20" | jq -r '[.deployments[] | select(.readyState=="READY")] | .[0].url // empty')
          echo "DID=$DID"
          echo "DURL=$DURL"
          echo "=== alias object ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v4/aliases/easyerp-api-three.vercel.app?teamId=$VERCEL_ORG_ID" | jq . | head -n 60
          ALIAS_DID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v4/aliases/easyerp-api-three.vercel.app?teamId=$VERCEL_ORG_ID" | jq -r '.deployment.id // empty')
          echo "ALIAS_DID=$ALIAS_DID"
          TARGET_DID=${ALIAS_DID:-$DID}
          echo "TARGET_DID=$TARGET_DID"
          echo "=== build logs for TARGET_DID ==="
          vercel inspect "$TARGET_DID" --logs 2>&1 | tail -n 300 || true
          echo "=== runtime logs via vercel logs ==="
          timeout 30 vercel logs --deployment "$TARGET_DID" --since 24h 2>&1 | tail -n 1500 || echo "no logs via --deployment"
          echo "=== Vercel API events for TARGET_DID ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/deployments/$TARGET_DID/events?teamId=$VERCEL_ORG_ID&limit=200" | head -c 12000; echo
          echo "=== curl alias health ==="
          curl -s -D - "https://easyerp-api-three.vercel.app/api/health" -o /tmp/body.txt 2>&1 | head -n 30
          echo "--- body ---"; cat /tmp/body.txt | head -c 2000; echo
          if [ -n "$DURL" ]; then
            echo "=== curl deployment url health ==="
            curl -s -D - "https://$DURL/api/health" -o /tmp/body2.txt 2>&1 | head -n 30
            echo "--- body2 ---"; cat /tmp/body2.txt | head -c 2000; echo
          fi
      - name: Env decrypt check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          set +e
          echo "=== Vercel API envs decrypted ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_ORG_ID" | jq -r '.envs[] | "\(.key) target=\(.target|join(",")) type=\(.type) len=\(.value|length) head=\(.value[0:50])"' | sort
          echo "=== BETTER_AUTH_URL ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_ORG_ID" | jq -r '.envs[] | select(.key=="BETTER_AUTH_URL") | .value' | head -c 200; echo
          echo "=== CORS_ORIGINS ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_ORG_ID" | jq -r '.envs[] | select(.key=="CORS_ORIGINS") | .value' | head -c 200; echo
          echo "=== DATABASE_URL head ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_ORG_ID" | jq -r '.envs[] | select(.key=="DATABASE_URL") | .value' | cut -c1-100; echo
          echo "=== DOCUMENT_ARCHIVE_ROOT ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_ORG_ID" | jq -r '.envs[] | select(.key=="DOCUMENT_ARCHIVE_ROOT") | .value' | head -c 200; echo
      - name: Neon DB ping
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          set +e
          pnpm add -g neonctl@8.7.2 2>&1 | tail -n 3
          echo "=== branches ==="
          neonctl branches list --project-id "$NEON_PROJECT_ID" --output json | jq . 2>&1 | head -n 100 || true
          POOLED_NEON=$(neonctl connection-string --project-id "$NEON_PROJECT_ID" --branch demo --pooled 2>&1 | tail -n 1)
          echo "pooled_neon len ${#POOLED_NEON} head ${POOLED_NEON:0:80}..."
          DB_VERCEL=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_ORG_ID" | jq -r '.envs[] | select(.key=="DATABASE_URL") | .value')
          echo "vercel DATABASE_URL len ${#DB_VERCEL} head ${DB_VERCEL:0:80}..."
          if [ "$POOLED_NEON" = "$DB_VERCEL" ]; then echo "MATCH"; else echo "DIFFER"; fi
          echo "=== ping both ==="
          for CS in "$DB_VERCEL" "$POOLED_NEON"; do
            echo "--- testing CS head ${CS:0:60} ---"
            CS="$CS" node --input-type=module <<'NODE'
          import pg from 'pg';
          const cs = process.env.CS;
          console.log('testing', cs.slice(0,70));
          const c = new pg.Client({connectionString: cs});
          try {
            await c.connect();
            console.log('connected');
            const r = await c.query('select count(*) as business_count from business');
            console.log('business_count', r.rows[0]);
            const m = await c.query("select name from _prisma_migrations order by finished_at desc limit 5");
            console.log('migrations', m.rows.map(x=>x.name));
            try { const u = await c.query('select count(*) as u from auth_user'); console.log('auth_user', u.rows[0]); } catch(e){ console.log('auth_user fail', e.message.slice(0,300)); }
            await c.end();
            console.log('DB OK');
          } catch(e){ console.error('DB FAIL', e.message); console.error(e.code, e.stack?.slice(0,3000)); }
          NODE
          done
