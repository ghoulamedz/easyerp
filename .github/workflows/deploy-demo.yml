name: Deploy Demo (Vercel + Neon)

# Deploys the demo stack on every push to master:
#   - API → Vercel Serverless Functions (Node.js)
#   - Web → Vercel (Next.js static + SSR)
#   - DB  → Neon serverless Postgres (free tier)

# Manual only, deliberately. This workflow deploys the demo that a client is using as
# production, so a merge is not a reason to publish it: the release is a decision.
#   gh workflow run deploy-demo.yml --ref master
on:
  workflow_dispatch:

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  neon-db:
    name: Neon DB (branch + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      database_url: ${{ steps.neon.outputs.database_url }}
      database_url_unpooled: ${{ steps.neon.outputs.database_url_unpooled }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps (needed for prisma:migrate:deploy below)
        run: pnpm install --frozen-lockfile

      - name: Install neonctl
        run: pnpm add -g neonctl@8.7.2

      - name: Authenticate to Neon
        run: echo "NEON_API_KEY=${{ secrets.NEON_API_KEY }}" >> $GITHUB_ENV

      - name: Create/update demo branch
        id: neon
        run: |
          set -euo pipefail
          BRANCH="demo"

          JSON=$(neonctl branches list --project-id ${{ secrets.NEON_PROJECT_ID }} --output json)

          # Demo branch is persistent — identical to prod: keep data across deploys.
          # Create only if missing; never delete/reset. Migrations handle schema drift.
          if echo "$JSON" | jq -e --arg b "$BRANCH" '
            if type == "array" then any(.[]; .name == $b)
            elif has("branches") then any(.branches[]; .name == $b)
            elif has("data") then any(.data[]; .name == $b)
            else false end
          ' >/dev/null; then
            echo "Branch $BRANCH already exists — reusing (data preserved)."
          else
            # Pick a parent that is NOT the demo branch itself. Prefer primary.
            PARENT_BRANCH=$(echo "$JSON" | jq -r --arg b "$BRANCH" '
              (if type == "array" then . elif has("branches") then .branches elif has("data") then .data else [] end)
              | (map(select(.primary == true))[0] // map(select(.name != $b))[0] // .[0])
              | .name // "main"
            ')
            if [ "$PARENT_BRANCH" = "$BRANCH" ]; then PARENT_BRANCH=""; fi
            if [ -n "$PARENT_BRANCH" ]; then
              echo "Creating branch $BRANCH from $PARENT_BRANCH..."
              if ! neonctl branches create --project-id ${{ secrets.NEON_PROJECT_ID }} --name "$BRANCH" --parent "$PARENT_BRANCH" 2>/tmp/neon-create.err; then
                cat /tmp/neon-create.err
                echo "Parent $PARENT_BRANCH not found — retrying from primary branch..."
                neonctl branches create --project-id ${{ secrets.NEON_PROJECT_ID }} --name "$BRANCH"
              fi
            else
              echo "Creating branch $BRANCH from primary..."
              neonctl branches create --project-id ${{ secrets.NEON_PROJECT_ID }} --name "$BRANCH"
            fi
          fi

          # Resolve DB role: prefer "easyerp" if it exists, otherwise use the project's
          # default role (often the owner). This avoids "role does not exist" on new Neon projects.
          ROLE="easyerp"
          ROLES_JSON=$(neonctl roles list --project-id ${{ secrets.NEON_PROJECT_ID }} --output json 2>/dev/null || echo '[]')
          if ! echo "$ROLES_JSON" | jq -e --arg r "$ROLE" '
            if type=="array" then any(.[]; .name==$r)
            elif has("roles") then any(.roles[]; .name==$r)
            elif has("data") then any(.data[]; .name==$r)
            else false end' >/dev/null 2>&1; then
            ROLE=$(echo "$ROLES_JSON" | jq -r '
              if type=="array" then .[0].name // "" 
              elif has("roles") then .roles[0].name // ""
              elif has("data") then .data[0].name // ""
              else "" end')
            if [ -z "$ROLE" ] || [ "$ROLE" = "null" ]; then ROLE="neondb_owner"; fi
            echo "Role easyerp not found, using $ROLE"
          fi
          POOLED=$(neonctl connection-string --project-id ${{ secrets.NEON_PROJECT_ID }} --branch "$BRANCH" --role "$ROLE" --pooled)
          UNPOOLED=$(neonctl connection-string --project-id ${{ secrets.NEON_PROJECT_ID }} --branch "$BRANCH" --role "$ROLE")

          echo "::add-mask::$POOLED"
          echo "::add-mask::$UNPOOLED"
          echo "database_url=$POOLED" >> $GITHUB_OUTPUT
          echo "database_url_unpooled=$UNPOOLED" >> $GITHUB_OUTPUT

      - name: Apply migrations to demo branch
        run: pnpm --filter @easyerp/api prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url_unpooled }}

  deploy:
    name: Deploy API and Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: neon-db
    env:
      VERCEL_PROJECT_ID_API: ${{ secrets.VERCEL_PROJECT_ID_API }}
      VERCEL_PROJECT_ID_WEB: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check the deployment credentials are present
        # `vercel deploy` finds its project in `VERCEL_PROJECT_ID`, paired with
        # `VERCEL_ORG_ID`, or from a linked `.vercel/` directory. This workflow
        # has neither, and passes the ids explicitly to `vercel env` instead, so a
        # deploy step that loses its `env:` block fails with the CLI's own message
        # ("You specified VERCEL_ORG_ID but you forgot to specify
        # VERCEL_PROJECT_ID") several minutes in. Name the missing secret here.
        run: |
          set -euo pipefail
          missing=""
          [ -z "${VERCEL_TOKEN:-}" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${VERCEL_ORG_ID:-}" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "${VERCEL_PROJECT_ID_API:-}" ] && missing="$missing VERCEL_PROJECT_ID_API"
          [ -z "${VERCEL_PROJECT_ID_WEB:-}" ] && missing="$missing VERCEL_PROJECT_ID_WEB"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "Credentials present for org ${VERCEL_ORG_ID}."

      - name: Install the Vercel and Neon CLIs
        # Nothing else. Vercel builds both projects itself from `buildCommand` in
        # each `vercel.json`, on its own builders, with `--frozen-lockfile`. An
        # install and a build here would produce a second, unused artifact and
        # cost minutes — the previous version of this workflow did exactly that,
        # twice, and deployed each project twice as well.
        run: pnpm add -g vercel@latest neonctl@8.7.2

      - name: Resolve the projects' production origins
        id: origins
        # Every production domain, not one of them. A Vercel project answers on
        # several at once — the auto `<project>-<team>.vercel.app`, plus whatever
        # a human added (`easyerp-web.vercel.app`) — and they are returned in an
        # order nobody controls. Taking element [0] put the auto name in
        # CORS_ORIGINS and the domain the visitor actually used was rejected at
        # sign-in (403 INVALID_ORIGIN) while the deployment's own log said the
        # origin was correct. All of them go in, comma-separated, which is what
        # CORS_ORIGINS already means (`env.ts` splits on commas).
        #
        # There is deliberately no `<project>.vercel.app` guess: Vercel domains
        # are global, so `easyerp.vercel.app` belongs to a different account and
        # guessing it would trust a stranger's origin. No domains resolved is a
        # failed job, not a fallback.
        run: |
          set -euo pipefail

          project_origins() {
            local project_id="$1" json domains
            json=$(curl -sf -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v9/projects/${project_id}?teamId=${VERCEL_ORG_ID}") || true
            if [ -z "${json:-}" ]; then
              echo "::error::Could not read Vercel project ${project_id}; refusing to guess an origin." >&2
              return 1
            fi
            # The complete domain list. `limit` is raised because Vercel's default
            # page size would silently truncate a project with many domains, and a
            # truncated list is this step's original bug in a quieter costume.
            local listed
            listed=$(curl -sf -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v9/projects/${project_id}/domains?teamId=${VERCEL_ORG_ID}&limit=100" 2>/dev/null || true)
            if [ -z "${listed:-}" ]; then
              echo "::warning::Could not list the domains of project ${project_id}; falling back to the aliases on the project record, which may not include every domain a visitor uses." >&2
              listed='{}'
            fi

            # Three shapes, unioned and deduplicated: the project record's
            # production aliases, any alias targeted at production (a custom
            # domain), and the project's own domain list — which is the complete
            # set and the one that catches the domain a person actually types.
            domains=$(jq -r --argjson listed "$listed" '
              (
                (.targets?.production?.alias? // [])[]
                , ([.alias[]? | select(.target == "production") | .domain][])
                , ($listed.domains? // [] | .[] | .name)
              )
              | select(type == "string" and length > 0)
            ' <<<"$json" 2>/dev/null | sort -u || true)

            if [ -z "$domains" ]; then
              echo "::error::No production domain on Vercel project ${project_id}." >&2
              return 1
            fi

            local out=""
            while IFS= read -r d; do
              out="${out:+$out,}https://${d}"
            done <<<"$domains"
            echo "$out"
          }

          WEB_ORIGINS=$(project_origins "${VERCEL_PROJECT_ID_WEB}")
          API_ORIGINS=$(project_origins "${VERCEL_PROJECT_ID_API}")
          if [ -z "$WEB_ORIGINS" ] || [ -z "$API_ORIGINS" ]; then
            echo "::error::An origin list came back empty; refusing to write a trust list that would reject every visitor."
            exit 1
          fi

          # The first entry is the project's primary domain, used where exactly one
          # origin is needed (Better Auth's baseURL, the Web's proxy target). Every
          # entry is trusted, so it does not matter which one a visitor uses.
          echo "web_origins=${WEB_ORIGINS}" >> $GITHUB_OUTPUT
          echo "api_origins=${API_ORIGINS}" >> $GITHUB_OUTPUT
          echo "web_origin=${WEB_ORIGINS%%,*}" >> $GITHUB_OUTPUT
          echo "api_origin=${API_ORIGINS%%,*}" >> $GITHUB_OUTPUT
          echo "Web origins (what a browser may present): ${WEB_ORIGINS}"
          echo "API origins (where the Web proxies /api): ${API_ORIGINS}"

      - name: Write the API project's environment
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          WEB_ORIGINS: ${{ steps.origins.outputs.web_origins }}
        run: |
          set -euo pipefail
          API_ARGS="--token=${VERCEL_TOKEN} --scope=${VERCEL_ORG_ID} --project=${VERCEL_PROJECT_ID_API}"

          # DATABASE_URL is resolved in *this* shell rather than taken from the
          # `neon-db` job's output: GitHub blanks an output that looks like a
          # secret ("Skip output database_url since it may contain secret"), which
          # would deploy an empty value.
          ROLE="easyerp"
          ROLES_JSON=$(neonctl roles list --project-id ${{ secrets.NEON_PROJECT_ID }} --output json 2>/dev/null || echo '[]')
          if ! echo "$ROLES_JSON" | jq -e --arg r "$ROLE" '
            if type=="array" then any(.[]; .name==$r)
            elif has("roles") then any(.roles[]; .name==$r)
            elif has("data") then any(.data[]; .name==$r)
            else false end' >/dev/null 2>&1; then
            ROLE=$(echo "$ROLES_JSON" | jq -r '
              if type=="array" then .[0].name // ""
              elif has("roles") then .roles[0].name // ""
              elif has("data") then .data[0].name // ""
              else "" end')
            if [ -z "$ROLE" ] || [ "$ROLE" = "null" ]; then ROLE="neondb_owner"; fi
            echo "Role easyerp not found, using $ROLE" >&2
          fi
          POOLED=$(neonctl connection-string --project-id ${{ secrets.NEON_PROJECT_ID }} --branch demo --role "$ROLE" --pooled)
          echo "::add-mask::$POOLED"
          if [ -z "$POOLED" ]; then echo "::error::Could not resolve DATABASE_URL." >&2; exit 1; fi

          # Written once, before the only deploy, and never a placeholder: a
          # placeholder deployed first and corrected afterwards is a live site that
          # rejects every sign-in until the second deploy lands. `env.ts` refuses
          # an `.invalid` origin in production so this cannot be shipped at all.
          write() {
            local name="$1" value="$2"
            vercel env rm "$name" production --yes $API_ARGS 2>/dev/null || true
            printf '%s' "$value" | vercel env add "$name" production $API_ARGS
          }

          write DATABASE_URL "$POOLED"
          write BETTER_AUTH_SECRET "${{ secrets.DEMO_BETTER_AUTH_SECRET }}"
          # The origin the BROWSER uses for /api/auth/*, which is the Web's stable
          # domain: the browser calls same-origin /api/* and Next rewrites it here.
          write BETTER_AUTH_URL "${WEB_ORIGINS%%,*}"
          write CORS_ORIGINS "$WEB_ORIGINS"
          write FIRST_SETUP_TOKEN "${{ secrets.DEMO_FIRST_SETUP_TOKEN }}"
          write NODE_ENV production
          write API_PORT 3002
          write API_HOST 0.0.0.0
          write LOG_LEVEL info

      - name: Write the Web project's environment
        env:
          API_ORIGIN: ${{ steps.origins.outputs.api_origin }}
        run: |
          set -euo pipefail
          WEB_ARGS="--token=${VERCEL_TOKEN} --scope=${VERCEL_ORG_ID} --project=${VERCEL_PROJECT_ID_WEB}"
          write() {
            local name="$1" value="$2"
            vercel env rm "$name" production --yes $WEB_ARGS 2>/dev/null || true
            printf '%s' "$value" | vercel env add "$name" production $WEB_ARGS
          }
          # Read at build time by `next.config.ts` for the /api rewrite. The API's
          # stable domain, not a deployment hostname: a pinned deployment would
          # freeze its environment snapshot, which is how a sign-in came to be
          # proxied to a build carrying a placeholder CORS_ORIGINS and answered
          # 403 INVALID_ORIGIN while the API's own domain worked.
          write API_INTERNAL_URL "$API_ORIGIN"
          write NODE_ENV production

      - name: Deploy API to Vercel
        # `VERCEL_PROJECT_ID`, exactly: that is the name the CLI reads, together
        # with `VERCEL_ORG_ID` at the top of this file. The job-level variables are
        # `..._API`/`..._WEB` because one job serves two projects, and the `vercel
        # env` steps above use `--project=` for the same reason. Neither is visible
        # to `vercel deploy`, which takes no `--project` flag.
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}

      - name: Deploy Web to Vercel
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}

      - name: Smoke test every Web origin
        env:
          WEB_ORIGINS: ${{ steps.origins.outputs.web_origins }}
          API_ORIGIN: ${{ steps.origins.outputs.api_origin }}
        # Two questions, asked the way a visitor's browser asks them: does the API
        # answer, and does the sign-in endpoint trust this origin — once per Web
        # origin, because a project answers on several and a trust list that holds
        # one of them leaves the visitor on another with a 403.
        #
        # Wrong credentials must come back something that proves Better Auth
        # handled the request (401, or 400/422 for the body, 429 if rate limited).
        # A 403 INVALID_ORIGIN here is the misconfiguration this step exists to
        # catch, and it needs no account to detect.
        run: |
          set -euo pipefail

          HEALTH=000
          for attempt in $(seq 1 20); do
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' "${API_ORIGIN}/api/health" || true)
            [ "$HEALTH" = "200" ] && break
            sleep 10
          done
          if [ "$HEALTH" != "200" ]; then
            echo "::error::${API_ORIGIN}/api/health answered ${HEALTH}, not 200."
            exit 1
          fi

          IFS=',' read -r -a origins <<<"$WEB_ORIGINS"
          failed=0
          for origin in "${origins[@]}"; do
            STATUS=000
            attempt=0
            for _ in $(seq 1 12); do
              attempt=$((attempt + 1))
              STATUS=$(curl -s -o /tmp/signin.json -w '%{http_code}' \
                -X POST "${origin}/api/auth/sign-in/email" \
                -H "Origin: ${origin}" -H 'content-type: application/json' \
                -d '{"email":"smoke-test@invalid","password":"not-a-real-password"}' || true)
              case "$STATUS" in
                # A rejected origin is a configuration fact, not a rollout race:
                # retrying it twelve times only delays the report by two minutes.
                403) break ;;
                # 401 wrong credentials (the expected answer), 400/422 rejected
                # body, 429 rate limited: in all of these Better Auth *decided*,
                # which is the question. Deliberately not "any 4xx": a 404 means
                # the route is not there at all.
                401|400|422|429) break ;;
              esac
              sleep 10
            done
            echo "  ${origin} -> ${STATUS} (attempt ${attempt}) $(head -c 100 /tmp/signin.json)"
            if [ "$STATUS" = "403" ]; then
              echo "::error::${origin} is not trusted at sign-in (403 INVALID_ORIGIN): the origin list CORS_ORIGINS carries does not include it, or the Web proxy points at a deployment built without it."
              failed=1
            elif [ "$STATUS" != "401" ] && [ "$STATUS" != "400" ] && [ "$STATUS" != "422" ] && [ "$STATUS" != "429" ]; then
              echo "::error::${origin}/api/auth/sign-in/email answered ${STATUS}; the Web is not serving the API route through its proxy."
              cat /tmp/signin.json 2>/dev/null || true
              failed=1
            fi
          done
          [ "$failed" = "0" ] || exit 1
          echo "Every Web origin (${WEB_ORIGINS}) reached credential validation at sign-in."

      - name: Post deployment summary
        if: always()
        run: |
          {
            echo "## Demo deployment"
            echo ""
            echo "| Component | URL |"
            echo "|-----------|-----|"
            echo "| **Web app** | ${{ steps.origins.outputs.web_origins }} |"
            echo "| **API** | ${{ steps.origins.outputs.api_origins }} |"
            echo ""
            echo "Sign-in is at \`/fr/sign-in\`. The API trusts every Web origin above, verified by the smoke test."
          } >> $GITHUB_STEP_SUMMARY
