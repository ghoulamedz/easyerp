name: Deploy Demo (Vercel + Neon)

# Deploys the demo stack on every push to master:
#   - API → Vercel Serverless Functions (Node.js)
#   - Web → Vercel (Next.js static + SSR)
#   - DB  → Neon serverless Postgres (free tier)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  neon-db:
    name: Neon DB (branch + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      database_url: ${{ steps.neon.outputs.database_url }}
      database_url_unpooled: ${{ steps.neon.outputs.database_url_unpooled }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps (needed for prisma:migrate:deploy below)
        run: pnpm install --frozen-lockfile

      - name: Install neonctl
        run: pnpm add -g neonctl@8.7.2

      - name: Authenticate to Neon
        run: echo "NEON_API_KEY=${{ secrets.NEON_API_KEY }}" >> $GITHUB_ENV

      - name: Create/update demo branch
        id: neon
        run: |
          set -euo pipefail
          BRANCH="demo"

          JSON=$(neonctl branches list --project-id ${{ secrets.NEON_PROJECT_ID }} --output json)

          # Demo branch is persistent — identical to prod: keep data across deploys.
          # Create only if missing; never delete/reset. Migrations handle schema drift.
          if echo "$JSON" | jq -e --arg b "$BRANCH" '
            if type == "array" then any(.[]; .name == $b)
            elif has("branches") then any(.branches[]; .name == $b)
            elif has("data") then any(.data[]; .name == $b)
            else false end
          ' >/dev/null; then
            echo "Branch $BRANCH already exists — reusing (data preserved)."
          else
            # Pick a parent that is NOT the demo branch itself. Prefer primary.
            PARENT_BRANCH=$(echo "$JSON" | jq -r --arg b "$BRANCH" '
              (if type == "array" then . elif has("branches") then .branches elif has("data") then .data else [] end)
              | (map(select(.primary == true))[0] // map(select(.name != $b))[0] // .[0])
              | .name // "main"
            ')
            if [ "$PARENT_BRANCH" = "$BRANCH" ]; then PARENT_BRANCH=""; fi
            if [ -n "$PARENT_BRANCH" ]; then
              echo "Creating branch $BRANCH from $PARENT_BRANCH..."
              if ! neonctl branches create --project-id ${{ secrets.NEON_PROJECT_ID }} --name "$BRANCH" --parent "$PARENT_BRANCH" 2>/tmp/neon-create.err; then
                cat /tmp/neon-create.err
                echo "Parent $PARENT_BRANCH not found — retrying from primary branch..."
                neonctl branches create --project-id ${{ secrets.NEON_PROJECT_ID }} --name "$BRANCH"
              fi
            else
              echo "Creating branch $BRANCH from primary..."
              neonctl branches create --project-id ${{ secrets.NEON_PROJECT_ID }} --name "$BRANCH"
            fi
          fi

          # Resolve DB role: prefer "easyerp" if it exists, otherwise use the project's
          # default role (often the owner). This avoids "role does not exist" on new Neon projects.
          ROLE="easyerp"
          ROLES_JSON=$(neonctl roles list --project-id ${{ secrets.NEON_PROJECT_ID }} --output json 2>/dev/null || echo '[]')
          if ! echo "$ROLES_JSON" | jq -e --arg r "$ROLE" '
            if type=="array" then any(.[]; .name==$r)
            elif has("roles") then any(.roles[]; .name==$r)
            elif has("data") then any(.data[]; .name==$r)
            else false end' >/dev/null 2>&1; then
            ROLE=$(echo "$ROLES_JSON" | jq -r '
              if type=="array" then .[0].name // "" 
              elif has("roles") then .roles[0].name // ""
              elif has("data") then .data[0].name // ""
              else "" end')
            if [ -z "$ROLE" ] || [ "$ROLE" = "null" ]; then ROLE="neondb_owner"; fi
            echo "Role easyerp not found, using $ROLE"
          fi
          POOLED=$(neonctl connection-string --project-id ${{ secrets.NEON_PROJECT_ID }} --branch "$BRANCH" --role "$ROLE" --pooled)
          UNPOOLED=$(neonctl connection-string --project-id ${{ secrets.NEON_PROJECT_ID }} --branch "$BRANCH" --role "$ROLE")

          echo "::add-mask::$POOLED"
          echo "::add-mask::$UNPOOLED"
          echo "database_url=$POOLED" >> $GITHUB_OUTPUT
          echo "database_url_unpooled=$UNPOOLED" >> $GITHUB_OUTPUT

      - name: Apply migrations to demo branch
        run: pnpm --filter @easyerp/api prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url_unpooled }}

  vercel-env-pre:
    name: Pre-Deploy Env Vars (placeholders)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: neon-db
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Install neonctl
        run: pnpm add -g neonctl@8.7.2

      - name: Set API project environment variables (DATABASE_URL resolved via neonctl in same shell)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          # Resolve DATABASE_URL here (same shell) so GitHub secret-output masking doesn't blank it.
          # GitHub warns "Skip output database_url since it may contain secret" and blanks needs.neon-db.outputs.database_url.
          ROLE="easyerp"
          ROLES_JSON=$(neonctl roles list --project-id ${{ secrets.NEON_PROJECT_ID }} --output json 2>/dev/null || echo '[]')
          if ! echo "$ROLES_JSON" | jq -e --arg r "$ROLE" '
            if type=="array" then any(.[]; .name==$r)
            elif has("roles") then any(.roles[]; .name==$r)
            elif has("data") then any(.data[]; .name==$r)
            else false end' >/dev/null 2>&1; then
            ROLE=$(echo "$ROLES_JSON" | jq -r '
              if type=="array" then .[0].name // "" 
              elif has("roles") then .roles[0].name // ""
              elif has("data") then .data[0].name // ""
              else "" end')
            if [ -z "$ROLE" ] || [ "$ROLE" = "null" ]; then ROLE="neondb_owner"; fi
            echo "Role easyerp not found, using $ROLE" >&2
          fi
          POOLED=$(neonctl connection-string --project-id ${{ secrets.NEON_PROJECT_ID }} --branch demo --role "$ROLE" --pooled)
          echo "::add-mask::$POOLED"
          echo "Resolved DATABASE_URL len=${#POOLED} head=${POOLED:0:50}..." >&2
          if [ -z "$POOLED" ]; then echo "Failed to resolve DATABASE_URL via neonctl" >&2; exit 1; fi

          for var in DATABASE_URL BETTER_AUTH_SECRET BETTER_AUTH_URL CORS_ORIGINS FIRST_SETUP_TOKEN NODE_ENV API_PORT API_HOST LOG_LEVEL; do
            vercel env rm "$var" production --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} 2>/dev/null || true
          done

          vercel env add DATABASE_URL production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "$POOLED"
          vercel env add BETTER_AUTH_SECRET production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "${{ secrets.DEMO_BETTER_AUTH_SECRET }}"
          vercel env add BETTER_AUTH_URL production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "https://placeholder.invalid"
          vercel env add CORS_ORIGINS production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "https://placeholder.invalid"
          vercel env add FIRST_SETUP_TOKEN production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "${{ secrets.DEMO_FIRST_SETUP_TOKEN }}"
          vercel env add NODE_ENV production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "production"
          vercel env add API_PORT production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "3002"
          vercel env add API_HOST production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "0.0.0.0"
          vercel env add LOG_LEVEL production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "info"


      - name: Set Web project environment variables
        run: |
          for var in API_INTERNAL_URL NODE_ENV; do
            vercel env rm "$var" production --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_WEB }} 2>/dev/null || true
          done

          vercel env add API_INTERNAL_URL production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_WEB }} <<< "https://placeholder.invalid"
          vercel env add NODE_ENV production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_WEB }} <<< "production"

  deploy-api:
    name: Deploy API → Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [neon-db, vercel-env-pre]
    outputs:
      api_url: ${{ steps.save-url.outputs.api_url }}
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
      DATABASE_URL: ${{ needs.neon-db.outputs.database_url }}
      DATABASE_URL_UNPOOLED: ${{ needs.neon-db.outputs.database_url_unpooled }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps (including dev for build)
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Generate Prisma client
        run: pnpm --filter @easyerp/api prisma:generate

      - name: Build contracts
        run: pnpm --filter @easyerp/contracts build

      - name: Build API
        run: pnpm --filter @easyerp/api build

      - name: Deploy API to Vercel
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}

      - name: Save API deployment URL
        id: save-url
        run: |
          set -euo pipefail
          vercel ls --scope ${{ secrets.VERCEL_ORG_ID }} --json > /tmp/vercel_ls.json
          head -c 1200 /tmp/vercel_ls.json; echo
          URL=$(jq -r '
            def first_deploy: if type=="array" then .[0] elif has("deployments") then .deployments[0] elif has("data") then .data[0] elif has("url") then . else empty end;
            first_deploy | (.alias[0] // .url // empty)
          ' /tmp/vercel_ls.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Failed to resolve API deployment URL from:" >&2
            cat /tmp/vercel_ls.json >&2
            exit 1
          fi
          echo "api_url=https://$URL" >> $GITHUB_OUTPUT
          echo "API deployed to: https://$URL"

  deploy-web:
    name: Deploy Web → Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [neon-db, vercel-env-pre, deploy-api]
    outputs:
      web_url: ${{ steps.web_url.outputs.web_url }}
      web_production_url: ${{ steps.web_url.outputs.web_production_url }}
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
      API_INTERNAL_URL: ${{ needs.deploy-api.outputs.api_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Build contracts
        run: pnpm --filter @easyerp/contracts build

      - name: Build Web
        run: pnpm --filter @easyerp/web build
        env:
          API_INTERNAL_URL: ${{ needs.deploy-api.outputs.api_url }}

      - name: Deploy Web to Vercel
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}

      - name: Get Web deployment URL
        id: web_url
        env:
          VERCEL_PROJECT_ID_WEB: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          set -euo pipefail
          vercel ls --scope ${{ secrets.VERCEL_ORG_ID }} --json > /tmp/vercel_ls.json
          head -c 1200 /tmp/vercel_ls.json; echo
          URL=$(jq -r '
            def first_deploy: if type=="array" then .[0] elif has("deployments") then .deployments[0] elif has("data") then .data[0] elif has("url") then . else empty end;
            first_deploy | (.alias[0] // .url // empty)
          ' /tmp/vercel_ls.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Failed to resolve Web deployment URL from:" >&2
            cat /tmp/vercel_ls.json >&2
            exit 1
          fi
          echo "web_url=https://$URL" >> $GITHUB_OUTPUT
          echo "Web deployed to: https://$URL"

          # The origin a visitor actually uses is the project's stable production
          # domain, not this deployment's hostname: `vercel deploy --prod` mints a
          # new per-deployment hostname on every run, so a CORS_ORIGINS pinned to
          # it rejects the very next deploy's visitors at sign-in (403
          # INVALID_ORIGIN). The project record keeps the stable domain; ask the
          # API for it instead of guessing from the deployment list.
          TEAM_QUERY=""
          if [ -n "${VERCEL_ORG_ID:-}" ]; then TEAM_QUERY="?teamId=${VERCEL_ORG_ID}"; fi
          PROJECT_JSON=$(curl -sf -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID_WEB}${TEAM_QUERY}" || echo '{}')
          PROD_DOMAIN=$(echo "$PROJECT_JSON" | jq -r '
            ([(.targets.production.alias // [])[]] + [(.alias // [])[] | select(.target == "production") | .domain])
            | .[0] // empty' 2>/dev/null || true)
          if [ -n "$PROD_DOMAIN" ] && [ "$PROD_DOMAIN" != "null" ]; then
            echo "web_production_url=https://$PROD_DOMAIN" >> $GITHUB_OUTPUT
            echo "Web production domain: https://$PROD_DOMAIN"
          else
            echo "::warning::Could not resolve the Web project's stable production domain; CORS_ORIGINS falls back to this deployment's hostname and will move on the next deploy (the API's VERCEL_PROJECT_PRODUCTION_URL union still covers the stable domain at runtime)."
            echo "web_production_url=https://$URL" >> $GITHUB_OUTPUT
          fi

  vercel-env-final:
    name: Final Env Vars (real URLs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-api, deploy-web]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Update API project URL environment variables
        run: |
          for var in BETTER_AUTH_URL CORS_ORIGINS; do
            vercel env rm "$var" production --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} 2>/dev/null || true
          done
          # Both are the origin the BROWSER uses, which is the Web's stable
          # production domain, never a per-deployment hostname:
          #   BETTER_AUTH_URL = where the browser sees /api/auth/* (the Web; Next
          #                     rewrites /api/* to the API), so Better Auth's own
          #                     trusted origin, cookies and links name the origin a
          #                     browser actually presents.
          #   CORS_ORIGINS    = the same origin, exact, comma-separated, never a
          #                     wildcard. Vercel also injects VERCEL_URL and
          #                     VERCEL_PROJECT_PRODUCTION_URL into the function at
          #                     runtime and the API unions them in, so a fresh
          #                     deployment hostname cannot break sign-in.
          WEB_ORIGIN="${{ needs.deploy-web.outputs.web_production_url }}"
          if [ -z "$WEB_ORIGIN" ]; then
            echo "::error::No Web origin resolved; refusing to write a placeholder CORS_ORIGINS that would reject every visitor."
            exit 1
          fi
          vercel env add BETTER_AUTH_URL production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "$WEB_ORIGIN"
          vercel env add CORS_ORIGINS production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_API }} <<< "$WEB_ORIGIN"

      - name: Update Web project URL environment variables
        run: |
          vercel env rm "API_INTERNAL_URL" production --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_WEB }} 2>/dev/null || true
          vercel env add API_INTERNAL_URL production --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID_WEB }} <<< "${{ needs.deploy-api.outputs.api_url }}"

  redeploy:
    name: Redeploy with Real URLs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: vercel-env-final
    outputs:
      api_url: ${{ steps.save-api-url.outputs.api_url }}
      web_url: ${{ steps.save-web-url.outputs.web_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Redeploy API to Vercel
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}

      - name: Redeploy Web to Vercel
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}

      - name: Save final deployment URLs
        id: save-api-url
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          set -euo pipefail
          vercel ls --scope ${{ secrets.VERCEL_ORG_ID }} --json > /tmp/vercel_ls.json
          head -c 1200 /tmp/vercel_ls.json; echo
          URL=$(jq -r '
            def first_deploy: if type=="array" then .[0] elif has("deployments") then .deployments[0] elif has("data") then .data[0] elif has("url") then . else empty end;
            first_deploy | (.alias[0] // .url // empty)
          ' /tmp/vercel_ls.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Failed to resolve API deployment URL from:" >&2
            cat /tmp/vercel_ls.json >&2
            exit 1
          fi
          echo "api_url=https://$URL" >> $GITHUB_OUTPUT
          echo "API redeployed to: https://$URL"

      - name: Save final Web deployment URL
        id: save-web-url
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          set -euo pipefail
          vercel ls --scope ${{ secrets.VERCEL_ORG_ID }} --json > /tmp/vercel_ls.json
          head -c 1200 /tmp/vercel_ls.json; echo
          URL=$(jq -r '
            def first_deploy: if type=="array" then .[0] elif has("deployments") then .deployments[0] elif has("data") then .data[0] elif has("url") then . else empty end;
            first_deploy | (.alias[0] // .url // empty)
          ' /tmp/vercel_ls.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Failed to resolve Web deployment URL from:" >&2
            cat /tmp/vercel_ls.json >&2
            exit 1
          fi
          echo "web_url=https://$URL" >> $GITHUB_OUTPUT
          echo "Web redeployed to: https://$URL"

      - name: Post deployment summary
        if: always()
        run: |
          echo "## Demo Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **Web App** | ${{ steps.save-web-url.outputs.web_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **API** | ${{ steps.save-api-url.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Setup is open at \`/fr/setup\` — demo is fresh with no accounts." >> $GITHUB_STEP_SUMMARY
